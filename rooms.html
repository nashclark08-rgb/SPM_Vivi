<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTI Room Locations</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary:   #003B5C;
            --secondary: #FFFFFF;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #F5F5F5;
            color: #212121;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ─────────────────────────── */
        .hdr {
            background: var(--primary);
            color: var(--secondary);
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            flex-shrink: 0;
        }
        .hdr img { height: 40px; width: auto; display: none; border-radius: 3px; }
        .hdr-text h1 { font-size: 1rem; font-weight: 700; line-height: 1.2; }
        .hdr-text p  { font-size: 0.78rem; opacity: 0.8; margin-top: 0.1rem; }

        /* ── Timer banner ────────────────────── */
        .timer-banner {
            margin: 1rem 1rem 0;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .timer-banner-inner {
            background: var(--primary);
            color: var(--secondary);
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .timer-banner-inner.break    { background: #E65100; color: #FFFFFF; }
        .timer-banner-inner.complete { background: #1B5E20; color: #FFFFFF; }
        .timer-banner-inner.waiting  { background: #37474F; color: #FFFFFF; }

        .timer-label  { font-size: 0.8rem; font-weight: 600; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.06em; }
        .timer-digits { font-size: 2rem; font-weight: 800; letter-spacing: 0.03em; line-height: 1; }
        .timer-next   { font-size: 0.75rem; opacity: 0.8; margin-top: 0.2rem; }

        /* ── Online teachers ─────────────────── */
        .online-banner {
            margin: 0.75rem 1rem 0;
            background: #B71C1C;
            color: white;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            display: none;
        }

        /* ── Main content ────────────────────── */
        .content {
            flex: 1;
            padding: 1rem;
        }

        .page-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #757575;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.75rem;
        }

        /* ── Table ───────────────────────────── */
        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        thead th {
            background: var(--primary);
            color: var(--secondary);
            padding: 0.6rem 0.85rem;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        tbody tr { border-bottom: 1px solid #EEEEEE; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:nth-child(even) { background: #FAFAFA; }
        tbody td { padding: 0.6rem 0.85rem; }

        .empty {
            padding: 3rem 1rem;
            text-align: center;
            color: #9E9E9E;
        }

        /* ── Footer ─────────────────────────── */
        .footer {
            background: var(--primary);
            height: 6px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<header class="hdr">
    <img id="hdrLogo" src="" alt="">
    <div class="hdr-text">
        <h1 id="hdrSchool">Student Progress Meetings</h1>
        <p id="hdrEvent"></p>
    </div>
</header>

<div class="timer-banner" id="timerBanner" style="display:none">
    <div class="timer-banner-inner" id="timerInner">
        <div>
            <div class="timer-label"  id="timerLabel">Loading...</div>
            <div class="timer-digits" id="timerDigits"></div>
            <div class="timer-next"   id="timerNext"></div>
        </div>
    </div>
</div>

<div class="online-banner" id="onlineBanner"></div>

<div class="content">
    <p class="page-title" id="pageTitle">Teacher Locations</p>
    <div id="tableContainer"><div class="empty"><p>Loading&hellip;</p></div></div>
</div>

<div class="footer"></div>

<script>
    // ── Server time sync ──────────────────────────────────────────────
    // Anchor all timer math to Firebase's HTTP Date header so this phone
    // agrees with display.html (and other phones) within ~500ms regardless
    // of how far the local clock has drifted.
    const DEFAULT_FIREBASE_URL = 'https://spmvivi-d8f6b-default-rtdb.firebaseio.com';
    let _serverOffsetMs = 0;
    async function _syncServerTime() {
        try {
            const t1 = Date.now();
            const r = await fetch(DEFAULT_FIREBASE_URL + '/.json?shallow=true', { cache: 'no-store' });
            const t2 = Date.now();
            const h = r.headers.get('Date');
            if (h) {
                const serverMs = new Date(h).getTime();
                _serverOffsetMs = (serverMs + (t2 - t1) / 2) - t2;
            }
        } catch (e) {}
    }
    function _now() { return Date.now() + _serverOffsetMs; }

    // ── Data loading ──────────────────────────────────────────────────
    function getQueryParam(name) {
        const m = window.location.search.match(new RegExp('[?&]' + name + '=([^&#]*)'));
        return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
    }

    // New short-URL format: ?r=<firebase-id>&fb=<firebase-url>
    // Returns null if no ?r param, or if fetch fails (caller falls back to hash/localStorage)
    async function getFirebaseData() {
        const id = getQueryParam('r');
        const fb = getQueryParam('fb');
        if (!id || !fb) return null;
        try {
            const r = await fetch(fb.replace(/\/$/, '') + '/pti-rooms/' + encodeURIComponent(id) + '.json');
            if (!r.ok) return null;
            const obj = await r.json();
            return obj && obj.data ? obj.data : null;
        } catch (e) { return null; }
    }

    function getHashData() {
        const h = window.location.hash.slice(1);
        if (!h) return null;
        try { return JSON.parse(decodeURIComponent(escape(atob(h)))); } catch { return null; }
    }

    function fromStorage() {
        try {
            const s = JSON.parse(localStorage.getItem('pti_settings') || '{}');
            const t = JSON.parse(localStorage.getItem('pti_teachers') || '[]');
            return {
                t: t.map(r => ({ n: r.name||'', s: r.subject||'', r: r.room||'' })),
                sn: s.schoolName||'', ev: s.sessionName||'',
                p:  s.primaryColour||'#003B5C', sc: s.secondaryColour||'#FFFFFF',
                st: s.startTime||'', iv: s.interviewDuration||0,
                bk: s.breakDuration||0, ni: s.numberOfInterviews||0,
                logo: s.logoDataUrl||'',
                fb: localStorage.getItem('pti_firebase_url')||''
            };
        } catch { return null; }
    }

    // ── Timer ─────────────────────────────────────────────────────────
    function pad(n) { return String(Math.floor(n)).padStart(2,'0'); }
    function fmt(secs) { secs = Math.max(0, secs); return pad(secs/60) + ':' + pad(secs%60); }
    function fmt12h(d) {
        let h = d.getHours(), m = d.getMinutes();
        return `${h%12||12}:${pad(m)} ${h>=12?'PM':'AM'}`;
    }
    function timeToDate(hhmm) {
        if (!hhmm) return null;
        const [h, m] = hhmm.split(':').map(Number);
        const d = new Date(); d.setHours(h, m, 0, 0); return d;
    }

    // Both display.html and rooms.html calculate position from the same wall-clock start time.
    // No offset needed when device clocks are accurate (NTP-synced).
    const SYNC_OFFSET_SECS = 0;

    function getTimerState(d) {
        const now    = new Date(_now());
        const start  = timeToDate(d.st);
        if (!start || !d.iv || !d.ni) return null;
        const ivSecs  = d.iv * 60;
        const bkSecs  = (d.bk || 0) * 60;
        const cycle   = ivSecs + bkSecs;
        const total   = d.ni;

        if (now < start) return { phase: 'waiting', at: start };

        const elapsed = (now - start) / 1000 + SYNC_OFFSET_SECS;
        if (bkSecs === 0) {
            const idx = Math.floor(elapsed / ivSecs);
            if (idx >= total) return { phase: 'complete' };
            return { phase: 'interview', left: ivSecs - (elapsed % ivSecs),
                     next: new Date(start.getTime() + (idx+1)*ivSecs*1000) };
        }
        const ci  = Math.floor(elapsed / cycle);
        const pos = elapsed % cycle;
        if (ci >= total) return { phase: 'complete' };
        const nextStart = new Date(start.getTime() + (ci+1)*cycle*1000);
        if (pos < ivSecs) return { phase: 'interview', left: ivSecs - pos, next: nextStart };
        if (ci + 1 >= total) return { phase: 'complete' };
        return { phase: 'break', left: cycle - pos, next: nextStart };
    }

    // ── Render helpers ────────────────────────────────────────────────
    function esc(s) {
        return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Tick ──────────────────────────────────────────────────────────
    let timerData = null;

    function tick() {
        if (!timerData) return;
        const state = getTimerState(timerData);
        if (!state) return;

        const inner  = document.getElementById('timerInner');
        const label  = document.getElementById('timerLabel');
        const next   = document.getElementById('timerNext');
        const digits = document.getElementById('timerDigits');

        inner.className = 'timer-banner-inner ' + state.phase;

        if (state.phase === 'waiting') {
            label.textContent  = 'Session begins at';
            digits.textContent = fmt12h(state.at);
            next.textContent   = '';
        } else if (state.phase === 'complete') {
            label.textContent  = 'Session Complete';
            digits.textContent = '';
            next.textContent   = 'Thank you for attending';
        } else if (state.phase === 'interview') {
            label.textContent  = 'Interview in Progress';
            digits.textContent = fmt(state.left);
            next.textContent   = state.next ? `Move to next room at ${fmt12h(state.next)}` : '';
        } else {
            label.textContent  = 'Break Time';
            digits.textContent = fmt(state.left);
            next.textContent   = state.next ? `Next interview at ${fmt12h(state.next)}` : '';
        }
    }

    // ── Online teacher polling ────────────────────────────────────────
    function pollOnlineRooms(fbUrl) {
        fetch(fbUrl + '/pti-online.json')
            .then(r => r.json())
            .then(data => {
                if (!data || typeof data !== 'object') { hideOnline(); return; }
                const now = Date.now();
                const names = [];
                Object.values(data).forEach(e => {
                    const active = e.from ? (e.from <= now && e.until >= now) : e.until > now;
                    if (active && !names.includes(e.name)) names.push(e.name);
                });
                if (names.length) {
                    const b = document.getElementById('onlineBanner');
                    b.textContent = '💻 Online now: ' + names.join(', ');
                    b.style.display = 'block';
                } else { hideOnline(); }
            })
            .catch(() => hideOnline());
    }
    function hideOnline() { document.getElementById('onlineBanner').style.display = 'none'; }

    // ── Init ──────────────────────────────────────────────────────────
    async function init() {
        await _syncServerTime();
        setInterval(_syncServerTime, 60000);

        const d = (await getFirebaseData()) || getHashData() || fromStorage();
        if (!d) return;

        // Branding
        if (d.p)  document.documentElement.style.setProperty('--primary',   d.p);
        if (d.sc) document.documentElement.style.setProperty('--secondary',  d.sc);
        if (d.sn) {
            document.getElementById('hdrSchool').textContent = d.sn;
            document.title = d.sn + ' — PTI Room Locations';
        }
        if (d.ev) document.getElementById('hdrEvent').textContent = d.ev;
        if (d.logo) {
            const li = document.getElementById('hdrLogo');
            li.src = d.logo; li.style.display = 'block';
        }

        // Date title
        const today = new Date().toLocaleDateString('en-AU', {
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        });
        document.getElementById('pageTitle').textContent = `Teacher Locations — ${today}`;

        // Timer
        if (d.st && d.iv && d.ni) {
            timerData = d;
            document.getElementById('timerBanner').style.display = 'block';
            tick();
            // Align to SERVER whole-second boundary so this and display.html
            // show identical digits regardless of local clock drift
            setTimeout(() => { tick(); setInterval(tick, 1000); }, 1000 - (_now() % 1000));
        }

        // Online teachers (if Firebase URL is in payload)
        if (d.fb) {
            pollOnlineRooms(d.fb);
            setInterval(() => pollOnlineRooms(d.fb), 5000);
        }

        // Teacher table
        const container = document.getElementById('tableContainer');
        const teachers  = (d.t || []).filter(t => t.n || t.s || t.r);

        if (!teachers.length) {
            container.innerHTML = '<div class="empty"><p>Room information has not been set up yet.</p></div>';
            return;
        }

        const sorted = [...teachers].sort((a, b) => (a.n||'').localeCompare(b.n||''));
        const rows   = sorted.map(t => `
            <tr>
                <td>${esc(t.n)}</td>
                <td>${esc(t.s)}</td>
                <td>${esc(t.r)}</td>
            </tr>`).join('');

        container.innerHTML = `
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Teacher</th><th>Subject</th><th>Room</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>`;
    }

    init();
    </script>
</body>
</html>
